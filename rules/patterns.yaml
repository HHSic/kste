# KSTE patterns.yaml — 형태소 패턴 (T1, Kiwi 품사 태그 기준)
# 상태: 제안(proposed). 사람이 승인하기 전에는 확정이 아니다.
# 각 패턴은 fallback_regex(T0 근사)를 함께 둔다. Kiwi 가 없을 때 fallback_regex 만 돈다.
# morph 표기 (설계안 §3.2): 공백=인접 형태소, A|B=선택, TAG:형태=형태 지정, VV:*히=어간이 '히'로 끝남,
#   !(...)=문장에 해당 품사가 하나도 없음, chain(...)=조건을 만족하는 어절이 연속.
# precision: fallback_regex 의 오탐 정도 자체 평가. low 는 T1 이 있을 때 T0 결과를 쓰지 않는 것을 권한다.
# t0_enabled: false 는 fallback_regex(T0 근사)를 돌리지 않는다는 표시다. precision: low 항목에 붙이며 형태소 분석(T1)이 있을 때만 쓴다. 생략하면 true.
# exceptions: 이 경우 검사에서 뺀다 (목록 항목, 제목, 표 셀, 코드 스팬은 K1.8/K2.1 에 따라 별도 처리).
# 규칙 ID·등급은 확정 규칙 문서(docs/KSTE-규칙.md §13.5) 기준이다. draft_id 는 설계안 §2 초안 ID.
#   DEP- 접두 + status: deprecated 는 확정본에서 삭제된 초안 규칙이다(severity info, 린터는 실행하지 않는다).
# 스키마: schema/patterns.schema.json
patterns:
  - id: K2.6-001
    draft_id: K3.2-001
    name: 이중피동
    tier: 1
    morph: "(XSV:되|VV:*히|VV:*이|VV:*리|VV:*기) EC:어 VX:지"
    severity: error
    message: "이중피동. '-되다' 또는 '-어지다' 하나만 쓴다."
    source: "국립국어원 한눈에 알아보는 공공언어 바로 쓰기(개정판 2022) hannune p.28 '보여지다' 이중피동 부적절 [v2-0287]; 설계안 §3.2 patterns 예시"
    fallback_regex: "(?:되어|돼)(?:지|집|졌|져|짐)|보여(?:지|짐|집|졌|져)|(?:쓰|불|풀|열|묶)여?(?:려|여)(?:지|집|졌|져|짐)|(?:읽|닫|잊)혀(?:지|집|졌|져|짐)"
    precision: high
    examples:
      bad: "이 값은 0으로 보여집니다."
      good: "이 값은 0으로 보입니다."
    status: proposed
    note: "'보여지다' 외 형태(되어지다, 쓰여지다 등)는 국어원 pair 에 직접 사례가 없고 설계안 §3.2 예시의 확장이다. 사람 확인 필요. 104만 자 코퍼스에서 이중피동 5건뿐이라 린터 주력은 아니다."

  - id: K2.9-001
    draft_id: K3.3-001
    name: -시키다 사동
    tier: 1
    morph: "NNG XSV:시키"
    severity: info
    message: "불필요한 '-시키다'. 목적어를 직접 취하면 '-하다'로 쓴다."
    source: "국립국어원 공공언어 지침 연구보고서(2021) report2021 p.145 (PDF쪽, 설계안 표기 인쇄쪽 p.135) '사동의 의미가 없는 문장의 -시키다' (설계안 K3.3); hannune p.56 '개선시킬 → 개선할' [v2-0410]"
    fallback_regex: "[가-힣]{2,}시(?:키(?:다|고|며|면|지|는)|켜|킨|킬|킵니다)"
    precision: mid
    exceptions:
      - "본동사 '시키다'(음식을 시키다, 일을 시키다): VV:시키 로 분석되면 제외"
      - "사동 의미가 있는 경우(이해시키다, 통과시키다)는 사람이 판단"
    examples:
      bad: "통계 서비스를 개선시킨다."
      good: "통계 서비스를 개선한다."
    status: proposed

  - id: DEP-K4.6-001
    draft_id: K4.6-001
    name: 추측 완곡 (-ㄹ 것으로 보인다)
    tier: 1
    morph: "ETM NNB:것 JKB:으로 VV:보이"
    severity: info
    message: "추측·완곡 표현. 사실이면 단정하고, 불확실하면 조건이나 근거를 쓴다."
    source: "설계안 §3.2 patterns 예시, §2 K4.6 (STE 조동사 규칙 유추). 국어원 pair 직접 증거 없음 - 사람 확인 필요"
    fallback_regex: "[가-힣]\\s?것으로\\s?(?:보인다|보입니다|보이며|보여|판단된다|판단됩니다|생각된다|생각됩니다|추정된다|추정됩니다)"
    precision: mid
    exceptions:
      - "측정·통계 결과의 해석 문장(연구 보고서). 불확실성이 정보일 때"
    examples:
      bad: "성능이 개선될 것으로 보인다."
      good: "성능이 개선된다."
    status: deprecated
    deprecated_reason: "확정 규칙 문서 §13 변경 이력 참조 — 초안 K4.6 추측·완곡 표현 금지는 실무와 어긋나 삭제됨(§13.1). '-ㄹ 수 있습니다'는 매뉴얼 기능 설명 골격이고 전문가 변환에도 추측 표현 교정 유형이 없다."
    note: "banned.yaml DEP-K4.6-002 와 중복 탐지된다. 린터는 같은 위치를 한 번만 보고한다."

  - id: DEP-K4.6-002
    draft_id: K4.6-002
    name: 추측 완곡 (-ㄴ 것 같다)
    tier: 1
    morph: "ETM NNB:것 VA:같"
    severity: info
    message: "'-ㄴ 것 같다'는 추측이다. 사실이면 단정한다."
    source: "설계안 §2 K4.6 ('~인 것 같다'). 국어원 pair 직접 증거 없음 - 사람 확인 필요"
    fallback_regex: "[가-힣]\\s?것\\s?같(?:다|습니다|아|은|네요)"
    precision: mid
    examples:
      bad: "이 설정이 원인인 것 같습니다."
      good: "이 설정이 원인입니다."
    status: deprecated
    deprecated_reason: "확정 규칙 문서 §13 변경 이력 참조 — 초안 K4.6 추측·완곡 표현 금지는 실무와 어긋나 삭제됨(§13.1). '-ㄹ 수 있습니다'는 매뉴얼 기능 설명 골격이고 전문가 변환에도 추측 표현 교정 유형이 없다."

  - id: DEP-K3.4-001
    draft_id: K3.4-001
    name: 경동사 구성 (진행/실시/수행/시행 + 하다)
    tier: 1
    morph: "NNG JKO NNG:(진행|실시|수행|시행) XSV:하"
    severity: info
    message: "동작을 명사로 만든 뒤 경동사로 받았다. '검토를 진행하다 → 검토하다'처럼 동사로 쓴다."
    source: "설계안 §2 K3.4 (경동사 목록); 국립국어원 한눈에(2022) hannune p.44 '진행 중에 있습니다' [v2-0356], hannune p.64 '교육을 실시하게 → 교육을 하게' [v2-0450]"
    fallback_regex: "[가-힣]+[을를]\\s?(?:진행|실시|수행|시행)(?:하|한|합|했|할|해)"
    precision: mid
    exceptions:
      - "본동사 용법: 회의를 진행하다(주관), 법을 시행하다"
    examples:
      bad: "검토를 진행한다."
      good: "검토한다."
    status: deprecated
    deprecated_reason: "확정 규칙 문서 §13 변경 이력 참조 — 초안 K3.4 명사화 금지(검토를 진행하다)는 근거가 없어 삭제됨(§13.1). 전문가가 '위해성 평가를 실시하여야 한다'를 그대로 두었고(v2-0018) 보고서 동사 2위가 '수행하다'다."

  - id: K2.1-001
    draft_id: K2.3-001
    name: 개조식 종결 (함/됨/음/임)
    tier: 1
    morph: "(XSV|VV|VA|VCP|EP|XSA) ETN:(ㅁ|음) SF"
    severity: error
    message: "'-하다'를 생략한 개조식 종결(함./됨./음./임.). 본문 문장은 서술어로 끝맺는다."
    source: "설계안 §2 K2.3, §1.6 결론 3; 공공언어 지침 연구보고서(2021) report2021 p.49 개조식 해소 사례 [v2-0050]"
    fallback_regex: "(?:있음|없음|않음|아님|같음|것임|함|됨)\\s*[.]?\\s*$"
    flags: M
    precision: low
    t0_enabled: false
    exceptions:
      - "목록 항목(글머리·번호 목록 줄): 허용 (K2.1 '목록 항목, 제목, 표 셀은 제외')"
      - "표 셀, 제목"
    examples:
      bad: "자료 제출 필요함."
      good: "자료를 제출해야 합니다."
    status: proposed
    note: "T0 근사는 '수신함'(명사)처럼 '함'으로 끝나는 명사를 오탐한다. Kiwi 가 있으면 ETN 여부로 가린다."

  - id: K2.1-002
    draft_id: K4.9-001
    name: 서술어 없는 문장
    tier: 1
    morph: "!(VV|VA|VX|VCP|VCN|XSV|XSA)"
    severity: error
    message: "서술어가 없는 문장. 조사·어미·'-하다'를 복원해 서술어로 끝맺는다."
    source: "공공언어 지침 연구보고서(2021) 조사·어미·'-하다' 생략 금지(설계안 §2 K4.9) 서술어 복원 사례 hannune p.36 [v2-0325], hannune p.96 [v2-0631]; 설계안 §1.6 결론 3 (140쌍 실측)"
    fallback_regex: "(?<![다요오죠까네라자])[.?!]\\s*$"
    flags: M
    precision: low
    t0_enabled: false
    exceptions:
      - "제목, 목록 항목, 표 셀, 코드 블록, 참고 문헌"
    examples:
      bad: "에러 코드 목록."
      good: "에러 코드 목록을 확인하십시오."
    status: proposed
    note: "T0 근사는 영어·숫자·약어 끝 문장도 잡는 저정밀 근사다. 반드시 T1 로 확정한다."

  - id: K2.7-001
    draft_id: K2.1-001
    name: 명사 연쇄 (조사 없는 4어절 이상)
    tier: 1
    morph: "chain(NNG|NNP|SL|SN|NR|XPN|XSN, eojeol>=4, josa=none)"
    severity: warn
    message: "조사 없이 이어진 명사가 4어절 이상이다. 조사·'-의'·동사로 푼다. 6어절 이상이면 오류."
    source: "설계안 §2 K2.1; research/results/skeletons.md 6절 명사 연쇄(2어절 69.0%, 3어절 20.2%, 4어절 6.2%, 5+ 4.6%); 국어원 명사 나열 지양 hannune p.20 [v2-0238]"
    fallback_regex: "(?:[가-힣A-Za-z0-9]{2,}(?<![은는이가을를에의와과도로만다요])\\s+){3}[가-힣A-Za-z0-9]{2,}(?<![은는이가을를에의와과도로만다요])"
    precision: low
    t0_enabled: false
    exceptions:
      - "고정 명칭(제품명·규격명·기관명)이면 3어절 초과 허용. 처음 정의하고 약칭을 쓴다(K1.7)"
      - "목차·규격표·코드 식별자"
    examples:
      bad: "권장 안전 사용 기간"
      good: "권장하는 안전 사용 기간"
    status: proposed
    note: "skeletons §8-1: 본문 문장 상한 3어절, 4어절은 고정 명칭일 때만. metrics.yaml noun_chain_words warn 4 / error 6 과 연동."
