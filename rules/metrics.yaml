# KSTE metrics.yaml — 길이·밀도 임계값과 장르별 기준선
# 상태: 제안(proposed). 임계값은 설계안 §3.2 수정본 + 확정 규칙 문서(§10) 등급 반영. 사람이 승인하기 전에는 확정이 아니다.
# 임계값 근거: 설계안 §1.6 (2026-10-04 코퍼스 실측, 잘 쓴 문서 34편 104만 자).
#   길이·피동·연결어미는 국어원 140쌍 대조에서 좋은 글과 나쁜 글을 가르지 못했다 -> 오류가 아니라 경고/정보.
#   오류는 문법 완결성(K2.1)이다.
# 기준선 근거: research/results/measure_result.md (Kiwi 측정). 수치는 그 표의 범주 행 그대로다.
# 스키마: schema/metrics.schema.json
# rule: 이 임계값이 구현하는 확정 규칙 ID(docs/KSTE-규칙.md §13.5). 등급은 규칙 문서 기준(§0.1, §10).
#   K4.4 절차문 길이: 경고 17~20(=warn 16 초과), 강한 경고 21 이상(=strong 20 초과, 경고 등급, 엄격에서만 오류)
#   K5.1 서술문 길이: 경고 21~25(=warn 20 초과), 강한 경고 26 이상(=strong 25 초과)
metrics:
  procedural_words: {warn: 16, strong: 20, rule: K4.4}        # LG 매뉴얼 p90 15~18
  descriptive_words: {warn: 20, strong: 25, rule: K5.1}       # 개발자 문서 p90 16~25
  paragraph_sentences: {warn: 6, rule: K5.2}                  # 규칙 등급 정보 (엄격 모드에서 경고)
  noun_chain_words: {warn: 4, error: 6, rule: K2.7}           # 잘 쓴 문서 >=4어절 3~11%
  clause_connectors: {info: 3, show_by_default: false, rule: K3.1}                    # 좋은/나쁜 글 구분 못 함 -> 정보성
  passive_density: {info_vs_baseline: true, rule: K3.2}       # 장르 기준선 대비로만 표시 (매뉴얼 0.21, 기술보고서 0.33)
  info_preservation_ratio: {warn: 0.60, strict_error: 0.70, strict_warn: 0.85, rule: K8.3}  # 80% 모드 0.60 미만 경고 (전문가 수정 쌍 29%가 0.70 미만이라 0.70은 오탐이 많다). 엄격 모드 0.70 미만 오류, 0.85 미만 경고
  note: "길이·피동·연결어미는 140쌍 실측에서 좋은 글을 가르지 못했다. 오류가 아니라 경고/정보. 문법 완결성(K2.1)이 오류."

